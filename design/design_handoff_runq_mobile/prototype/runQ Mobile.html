<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>runQ Mobile · Flutter app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #ECE9E2;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv02','cv03','cv04','cv11';
    font-variant-numeric: tabular-nums;
    color: #1A1714;
    overflow: hidden;
  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
  button { font-family: inherit; }
  input { font-family: inherit; }

  @keyframes rqPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  @keyframes rqFade {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes rqSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 30% 20%, #F4F0E6 0%, transparent 50%),
      radial-gradient(circle at 70% 80%, #E8E2D4 0%, transparent 50%),
      #ECE9E2;
  }
  .device-wrap {
    transform-origin: center center;
  }
  .label {
    position: fixed; left: 0; right: 0; top: 24px; text-align: center;
    font-family: 'League Spartan', 'Inter', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
    color: #6B6358; text-transform: uppercase;
  }
  .label .q { color: #4F46E5; }
</style>
</head>
<body>
<div class="label">run<span class="q">Q</span> · Flutter mobile prototype</div>
<div id="root" class="stage"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#4F46E5"/>
    <text x="100" y="120" font-family="League Spartan, sans-serif" font-size="80" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="-2">run<tspan fill="#A5B4FC">Q</tspan></text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="env,react">
  // Shell: an iPhone frame with our app inside, scaled to viewport
  function Shell() {
    const W = 402, H = 874;
    const wrapRef = React.useRef(null);
    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const fit = () => {
        const vw = window.innerWidth, vh = window.innerHeight;
        const s = Math.min((vw - 60) / W, (vh - 90) / H, 1);
        setScale(s);
      };
      fit();
      window.addEventListener('resize', fit);
      return () => window.removeEventListener('resize', fit);
    }, []);

    return (
      <div className="device-wrap" ref={wrapRef} style={{ transform: `scale(${scale})` }}>
        <IOSDevice width={W} height={H}>
          <div data-screen-label="01 runQ Mobile" style={{ position: 'absolute', inset: 0 }}>
            <window.RunQApp/>
          </div>
        </IOSDevice>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Shell/>);
</script>
</body>
</html>
