<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>runQ — Dashboard</title>
    <link rel="icon" href="assets/runq-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg: oklch(0.99 0.003 264);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.985 0.004 264);
        --border: oklch(0.92 0.005 264);
        --border-soft: oklch(0.95 0.004 264);
        --text: oklch(0.22 0.015 264);
        --text-2: oklch(0.45 0.012 264);
        --text-3: oklch(0.62 0.008 264);
        --accent: oklch(0.55 0.2 268);
        --accent-soft: oklch(0.96 0.03 268);
        --accent-text: oklch(0.45 0.18 268);
        --pos: oklch(0.6 0.15 155);
        --pos-soft: oklch(0.96 0.04 155);
        --neg: oklch(0.6 0.18 25);
        --neg-soft: oklch(0.96 0.04 25);
        --warn: oklch(0.72 0.15 75);
        --warn-soft: oklch(0.96 0.05 80);
      }
      .dark {
        /* warm-tinted dark, less clinical than zinc-950 */
        --bg: oklch(0.155 0.008 264);
        --surface: oklch(0.195 0.01 264);
        --surface-2: oklch(0.22 0.011 264);
        --border: oklch(0.28 0.012 264);
        --border-soft: oklch(0.24 0.01 264);
        --text: oklch(0.96 0.005 264);
        --text-2: oklch(0.72 0.012 264);
        --text-3: oklch(0.55 0.012 264);
        --accent: oklch(0.72 0.18 268);
        --accent-soft: oklch(0.28 0.06 268);
        --accent-text: oklch(0.78 0.16 268);
        --pos: oklch(0.74 0.16 155);
        --pos-soft: oklch(0.28 0.06 155);
        --neg: oklch(0.72 0.18 25);
        --neg-soft: oklch(0.3 0.07 25);
        --warn: oklch(0.78 0.15 75);
        --warn-soft: oklch(0.3 0.06 80);
      }
      html, body, #root { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
      .surface { background: var(--surface); }
      .surface-2 { background: var(--surface-2); }
      .border-app { border-color: var(--border); }
      .border-soft { border-color: var(--border-soft); }
      .text-1 { color: var(--text); }
      .text-2 { color: var(--text-2); }
      .text-3 { color: var(--text-3); }
      .accent-bg { background: var(--accent); }
      .accent-text { color: var(--accent-text); }
      .accent-soft-bg { background: var(--accent-soft); }
      .pos-text { color: var(--pos); }
      .pos-soft-bg { background: var(--pos-soft); }
      .neg-text { color: var(--neg); }
      .neg-soft-bg { background: var(--neg-soft); }
      .warn-text { color: var(--warn); }
      .warn-soft-bg { background: var(--warn-soft); }

      /* invisible scrollbars that appear on hover */
      .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
      .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
      .scrollbar-thin:hover::-webkit-scrollbar-thumb { background: var(--border); }

      .density-comfortable { --row-y: 14px; --gap: 20px; --pad: 20px; }
      .density-balanced { --row-y: 10px; --gap: 16px; --pad: 16px; }
      .density-dense { --row-y: 7px; --gap: 12px; --pad: 12px; }

      /* subtle grid bg for hero */
      .grid-bg {
        background-image:
          radial-gradient(circle at 1px 1px, var(--border-soft) 1px, transparent 0);
        background-size: 18px 18px;
      }

      /* sparkline anim */
      @keyframes draw { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
      .spark path { stroke-dasharray: 200; animation: draw 1.2s ease-out forwards; }

      @keyframes pulse-soft { 0%,100%{ opacity:.6 } 50%{ opacity:1 } }
      .pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .agent-glow {
        background: linear-gradient(90deg, transparent, var(--accent-soft) 30%, var(--accent-soft) 70%, transparent);
        opacity: 0.8;
      }

      /* command palette backdrop */
      .cmdk-backdrop {
        background: color-mix(in oklab, black 30%, transparent);
        backdrop-filter: blur(6px);
      }

      .focus-ring:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* link active indicator */
      .nav-active::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 16px;
        background: var(--accent);
        border-radius: 2px;
      }

      /* hide scroll on phone preview */
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="tweaks-panel.jsx"></script>

    <!-- Shared: icons, mock data, primitives (used everywhere) -->
    <script type="text/babel" src="src/shared/icons.jsx"></script>
    <script type="text/babel" src="src/shared/data.jsx"></script>
    <script type="text/babel" src="src/shared/primitives.jsx"></script>
    <script type="text/babel" src="src/shared/ar-primitives.jsx"></script>

    <!-- Shell: sidebar, topbar, command palette -->
    <script type="text/babel" src="src/shell/sidebar.jsx"></script>
    <script type="text/babel" src="src/shell/topbar.jsx"></script>
    <script type="text/babel" src="src/shell/cmdk.jsx"></script>

    <!-- Dashboard sections -->
    <script type="text/babel" src="src/dashboard/hero.jsx"></script>
    <script type="text/babel" src="src/dashboard/kpis.jsx"></script>
    <script type="text/babel" src="src/dashboard/cashflow.jsx"></script>
    <script type="text/babel" src="src/dashboard/agent-feed.jsx"></script>
    <script type="text/babel" src="src/dashboard/approvals-actions.jsx"></script>
    <script type="text/babel" src="src/dashboard/aging.jsx"></script>
    <script type="text/babel" src="src/dashboard/gst-close.jsx"></script>
    <script type="text/babel" src="src/dashboard/recent-docs.jsx"></script>

    <!-- AR module -->
    <script type="text/babel" src="src/ar/data.jsx"></script>
    <script type="text/babel" src="src/ar/customers.jsx"></script>
    <script type="text/babel" src="src/ar/invoices.jsx"></script>
    <script type="text/babel" src="src/ar/quotes-credits-receipts.jsx"></script>
    <script type="text/babel" src="src/ar/collections-dunning.jsx"></script>

    <!-- Help module -->
    <script type="text/babel" src="src/help/data.jsx"></script>
    <script type="text/babel" src="src/help/home.jsx"></script>
    <script type="text/babel" src="src/help/recipe.jsx"></script>

    <!-- App entry (must load last — composes everything above) -->
    <script type="text/babel" src="src/shell/app.jsx"></script>
  </body>
</html>
