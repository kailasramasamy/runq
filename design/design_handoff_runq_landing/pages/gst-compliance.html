<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GST compliance — runQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          serif: ['"Instrument Serif"', 'Georgia', 'serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          brand: {
            50:  'oklch(0.97 0.01 264)',
            100: 'oklch(0.94 0.03 264)',
            200: 'oklch(0.87 0.06 264)',
            300: 'oklch(0.79 0.10 264)',
            400: 'oklch(0.68 0.16 264)',
            500: 'oklch(0.59 0.20 264)',
            600: 'oklch(0.51 0.22 264)',
            700: 'oklch(0.46 0.20 264)',
            800: 'oklch(0.40 0.17 264)',
            900: 'oklch(0.36 0.13 264)',
            950: 'oklch(0.26 0.10 264)',
          },
        },
      },
    },
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background: #ffffff;
    color: #18181b;
  }
  .font-display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .font-mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .tabular     { font-variant-numeric: tabular-nums; }

  /* Gradient text */
  .grad-text {
    background: linear-gradient(100deg, oklch(0.59 0.20 264) 0%, oklch(0.62 0.23 295) 55%, oklch(0.66 0.18 330) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .grad-text-light {
    background: linear-gradient(100deg, oklch(0.78 0.16 264) 0%, oklch(0.78 0.18 295) 55%, oklch(0.82 0.14 330) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Subtle aurora glow used behind hero & dark sections */
  .aurora {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .aurora::before, .aurora::after {
    content: ''; position: absolute; border-radius: 9999px; filter: blur(80px); opacity: .55;
  }
  .aurora::before {
    width: 720px; height: 720px;
    background: radial-gradient(circle at 30% 30%, oklch(0.78 0.18 264 / .55), transparent 60%);
    top: -200px; left: -120px;
  }
  .aurora::after {
    width: 560px; height: 560px;
    background: radial-gradient(circle at 60% 50%, oklch(0.78 0.18 320 / .45), transparent 60%);
    top: -100px; right: -100px;
  }
  .aurora-dark::before {
    background: radial-gradient(circle at 30% 30%, oklch(0.59 0.22 264 / .35), transparent 60%);
  }
  .aurora-dark::after {
    background: radial-gradient(circle at 60% 50%, oklch(0.55 0.22 320 / .3), transparent 60%);
  }

  /* Dotted grid for dark sections */
  .dot-grid {
    background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .line-grid-light {
    background-image:
      linear-gradient(to right, rgba(24,24,27,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(24,24,27,0.045) 1px, transparent 1px);
    background-size: 56px 56px;
  }

  /* Pulsing dot in eyebrow */
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0; }
  }
  .pulse-dot::after {
    content: ''; position: absolute; inset: 0; border-radius: 9999px;
    background: currentColor; animation: pulse-dot 1.8s ease-out infinite;
  }

  /* Fade-up scroll reveal */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* Hover lift */
  .lift { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .lift:hover { transform: translateY(-2px); }

  /* Window chrome shadow stack for product mockups */
  .mockup-shadow {
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.06) inset,
      0 30px 60px -20px rgba(15,15,30,0.55),
      0 80px 120px -40px rgba(60,40,140,0.35);
  }
  .mockup-shadow-light {
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.9) inset,
      0 1px 2px rgba(15,15,30,0.04),
      0 12px 24px -10px rgba(15,15,30,0.10),
      0 40px 80px -30px rgba(70,50,180,0.18);
  }

  /* Phone bezel */
  .phone-bezel {
    background: linear-gradient(155deg, #1a1a1f 0%, #2c2c33 50%, #15151a 100%);
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.08) inset,
      0 -1px 0 0 rgba(0,0,0,0.5) inset,
      0 50px 80px -30px rgba(20,15,60,0.55),
      0 30px 50px -20px rgba(15,15,30,0.4);
  }

  /* Marquee */
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .marquee-track { animation: marquee 40s linear infinite; }

  /* Tab indicator transition handled by JS via inline styles */

  /* Bar chart bars rise */
  @keyframes bar-rise {
    from { transform: scaleY(0.05); }
    to { transform: scaleY(1); }
  }
  .bar-rise { transform-origin: bottom; animation: bar-rise 1.1s cubic-bezier(.2,.8,.2,1) both; }

  /* For CAs sticky bg */
  .ca-bg {
    background:
      radial-gradient(1200px 600px at 80% 0%, oklch(0.94 0.04 264 / .6), transparent 60%),
      #fafafa;
  }

  /* Disable text selection on chrome elements */
  .no-select { user-select: none; }

  /* Accent line on first nav drop */
  .nav-blur {
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
  }

  /* AI typing dots */
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .3; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  .typing-dot { animation: dot-bounce 1.2s infinite; display: inline-block; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }

  /* Rupee subtle bg watermark */
  .rupee-watermark {
    font-family: 'Instrument Serif', serif;
    color: rgba(255,255,255,0.025);
  }

  ::selection { background: oklch(0.78 0.18 264 / .35); }
</style>
</head>
<body class="overflow-x-hidden">
<div id="app"></div>
