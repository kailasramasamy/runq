name: dhenu
description: "Dhenu — milk procurement for farmers, VMCC, CC & PP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing — same stack as apps/mobile.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Type + numbers. Inter (Latin, tabular) + Noto Indic come via google_fonts.
  google_fonts: ^6.2.1
  intl: ^0.20.1

  # HTTP to the shared runq backend (/api/v1/milk-procurement/*).
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1

  # Auth — Google/Apple via Firebase + phone-DOB fallback (reused from apps/mobile).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  # FCM push — payment-credited / collection-reminder notifications. Token
  # registers to the shared runq backend (/dashboard/device-token).
  firebase_messaging: ^15.1.5

  # Offline-first pour capture: Hive FIFO queue, connectivity transitions,
  # uuid for the deviceLocalId idempotency key (mirrors wo_run_queue.dart).
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

  # Audio read-aloud (🔊) on rate + payment figures for low-literacy users.
  flutter_tts: ^4.2.0
  # Voice dictation for add-farmer form (low-literacy VMCC operators).
  speech_to_text: ^7.0.0
  flutter_lucide: ^1.11.0

  # Add Farmer — camera/gallery photo pick and GPS location capture.
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  # Share a cycle's pour statement PDF via the native share sheet.
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Emerald brand tile (spec §2). Placeholder art reused until the dhenu
# wordmark/glyph is finalised; replace assets, then re-run the icon tool.
flutter_launcher_icons:
  image_path: "assets/branding/dhenu-app-logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0F7A5A"
  adaptive_icon_foreground: "assets/branding/dhenu-app-logo.png"

flutter_native_splash:
  # Padded asset (drop centred on a transparent canvas) so the splash logo
  # renders at ~40% width instead of full-bleed/oversized. See dhenu-splash-logo.png.
  color: "#0F7A5A"
  image: "assets/branding/dhenu-splash-logo.png"
  color_dark: "#0B5E45"
  image_dark: "assets/branding/dhenu-splash-logo.png"
  android_12:
    color: "#0F7A5A"
    image: "assets/branding/dhenu-splash-logo.png"
    color_dark: "#0B5E45"
    image_dark: "assets/branding/dhenu-splash-logo.png"
