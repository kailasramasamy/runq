name: dhenu
description: "Dhenu — milk procurement for farmers, VMCC, CC & PP."
publish_to: 'none'
version: 1.0.11+15

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing — same stack as apps/mobile.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Type + numbers. Inter (Latin, tabular) + Noto Indic come via google_fonts.
  google_fonts: ^6.2.1
  intl: ^0.20.1

  # HTTP to the shared runq backend (/api/v1/milk-procurement/*).
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  # Reads the running build's version to compare against the server's
  # dhenu.minVersion for the force-update gate.
  package_info_plus: ^8.1.1

  # Firebase core — required by FCM push below (no social sign-in; login is
  # phone + OTP only).
  firebase_core: ^3.8.0
  # FCM push — payment-credited / collection-reminder notifications. Token
  # registers to the shared runq backend (/dashboard/device-token).
  firebase_messaging: ^15.1.5

  # Offline-first pour capture: Hive FIFO queue, connectivity transitions,
  # uuid for the deviceLocalId idempotency key (mirrors wo_run_queue.dart).
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

  # Audio read-aloud (🔊) on rate + payment figures for low-literacy users.
  flutter_tts: ^4.2.0
  # Voice dictation for add-farmer form (low-literacy VMCC operators).
  speech_to_text: ^7.0.0
  # Deep-link to the app's Settings page when mic permission is denied.
  permission_handler: ^11.3.1
  flutter_lucide: ^1.11.0

  # Add Farmer — camera/gallery photo pick and GPS location capture.
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  # On-device person cut-out for the farmer profile photo (offline, private).
  google_mlkit_selfie_segmentation: ^0.10.1
  image: ^4.3.0
  # Share a cycle's pour statement PDF via the native share sheet.
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Emerald brand tile (spec §2). Placeholder art reused until the dhenu
# wordmark/glyph is finalised; replace assets, then re-run the icon tool.
flutter_launcher_icons:
  image_path: "assets/branding/dhenu-app-logo.png"
  # iOS icon = drop on the same #0F7A5A as the splash, so the icon-open zoom
  # blends into the launch screen instead of flashing a lighter-green box.
  image_path_ios: "assets/branding/dhenu-app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0F7A5A"
  adaptive_icon_foreground: "assets/branding/dhenu-app-logo.png"

flutter_native_splash:
  # Plain emerald bridge only — no logo. The branded, animated drop + wordmark
  # + tagline live in the in-app SplashScreen (lib/screens/auth/splash_screen.dart),
  # which takes over the moment the engine boots and the drop falls in cleanly.
  color: "#0F7A5A"
  color_dark: "#0B5E45"
  android_12:
    color: "#0F7A5A"
    color_dark: "#0B5E45"
