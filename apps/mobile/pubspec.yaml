name: runq_mobile
description: "runQ Mobile — on-the-go companion for runQ ERP."
publish_to: 'none'
version: 1.0.20+37

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.20.1
  flutter_svg: ^2.0.16
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  cunning_document_scanner: ^1.4.0
  permission_handler: ^12.0.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  receive_sharing_intent: ^1.8.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2
  # Render the invoice UPI payload into a scannable QR so a customer can
  # pay into the business account on the spot (money-in is recon-driven).
  qr_flutter: ^4.1.0
  # On-device OCR (Apple Vision / Android model) to read UPI payment
  # confirmations locally — instant, offline, no API round-trip. Server
  # extractor stays as the fallback for PDFs / unreadable shots.
  google_mlkit_text_recognition: ^0.15.0
  # Geo-location for HR mobile attendance check-in / out (phase-next).
  geolocator: ^13.0.4
  # Multi-page bill scanning: stitch scanned page images into a single
  # grayscale PDF on-device before uploading.
  pdf: ^3.11.0
  # Sibling to `pdf` — used purely for PdfGoogleFonts so the payslip
  # PDF can render ₹ and em-dash (the default Helvetica core fonts
  # are ASCII-only). No printer/preview features used.
  image: ^4.5.4
  # App-sandboxed temp dir — required for share_plus to expose attachment
  # files to the iOS share extension.
  path_provider: ^2.1.5
  # In-app PDF preview for bill attachments.
  flutter_pdfview: ^1.4.0+1
  # Charts for cash-flow forecast, P&L, revenue/expense analytics.
  fl_chart: ^0.69.2
  # Swipe-to-reveal action buttons on invoice/bill rows.
  flutter_slidable: ^3.1.1
  # Markdown rendering for support agent chat bubbles.
  flutter_markdown: ^0.7.4
  # Realtime updates over WebSocket for support conversations.
  web_socket_channel: ^3.0.1
  # Firebase Cloud Messaging — mobile push notifications.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Mobile sign-in: phone OTP via MSG91 (server-side send/verify over Redis),
  # matched to an employee by phone. No Firebase Auth. firebase_core +
  # firebase_messaging below stay — FCM push still needs Firebase. See
  # docs/mobile-auth-plan.md.
  # Confetti burst animation for the employee rewards celebratory view.
  confetti: ^0.8.0
  # Manufacturing Phase 2.5 — offline queue for the WO Run view.
  # Hive backs the persistent FIFO; connectivity_plus drives the
  # online/offline transition; uuid generates client idempotency keys.
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  image_path: "assets/branding/runq-app-logo.png"
  image_path_ios: "assets/branding/runq-app-icon-ios.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/branding/runq-app-logo.png"

flutter_native_splash:
  color: "#6366F1"
  image: "assets/branding/runq-app-logo.png"
  color_dark: "#6366F1"
  image_dark: "assets/branding/runq-app-logo.png"
  android_12:
    color: "#6366F1"
    image: "assets/branding/runq-app-logo.png"
    color_dark: "#6366F1"
    image_dark: "assets/branding/runq-app-logo.png"

dependency_overrides:
  path_provider_foundation: 2.4.1
