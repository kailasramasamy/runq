# Replace YOUR_DOMAIN with your actual domain (e.g., erp.vrindavandairy.com)
# Replace SSL cert paths with your actual cert locations

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/ssl/certs/runq.crt;
    ssl_certificate_key /etc/ssl/private/runq.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (supplement @fastify/helmet)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    # Health check (no cache)
    location /health {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
    }

    # Frontend (static SPA)
    location / {
        root /var/www/runq/web;
        try_files $uri $uri/ /index.html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets with immutable cache
    location /assets/ {
        root /var/www/runq/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
